<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/brand/ihub-symbol.png" />
    <title>EdTech Inclusion Toolkit | iHUB</title>
    <meta name="description" content="Practical guides, interactive activities, and checklists to help educators, designers, and product teams build more inclusive learning experiences." />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet"/>
    <!-- Google Tag Manager -->
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-PTG2DX5D"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    </script>
    <!-- End Google Tag Manager -->
    <script type="module" src="/index.tsx"></script>
</head>
  <body class="bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark antialiased">
    <script>
      // Apply appearance before React loads; storage is optional.
      let appearance;
      try {
        const saved = JSON.parse(localStorage.getItem('ihub-accessibility-v1') || 'null');
        appearance = saved ? saved.theme : localStorage.getItem('theme');
      } catch { /* Use the device preference when storage is unavailable. */ }
      document.documentElement.classList.toggle('dark', appearance === 'dark' ||
        (appearance !== 'light' && appearance !== 'dark' && window.matchMedia('(prefers-color-scheme: dark)').matches));
    </script>
    <div id="root"></div>
  </body>
</html>
